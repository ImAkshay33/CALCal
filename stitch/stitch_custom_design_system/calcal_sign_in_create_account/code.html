<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "error-container": "#ffdad6", "border-subtle": "#ded6c4", "on-tertiary-fixed": "#2f1315", "inverse-primary": "#afceb9", "on-secondary-container": "#ebdfff", "secondary": "#6000d9", "surface-container-high": "#deece2", "secondary-fixed-dim": "#d1bcff", "page-background": "#e7dfcf", "status-safe": "#2d7a48", "background": "#effdf3", "tertiary-container": "#4c2b2d", "on-tertiary": "#ffffff", "inverse-on-surface": "#e6f4ea", "secondary-fixed": "#eaddff", "surface-container-low": "#e9f7ed", "primary-container": "#1f3a2b", "surface-tint": "#496553", "on-primary-fixed": "#052013", "on-secondary-fixed": "#24005b", "card-background": "#f0eadc", "inverse-surface": "#27332d", "on-error": "#ffffff", "ink-primary": "#1a2620", "outline-variant": "#c2c8c1", "header-panel": "#1f3a2b", "outline": "#727973", "action-text": "#ffffff", "on-tertiary-fixed-variant": "#613d3f", "header-text": "#f5f2eb", "surface-dim": "#cfddd4", "ink-secondary": "#55635a", "tertiary-fixed": "#ffdada", "on-primary-fixed-variant": "#314d3d", "on-secondary-fixed-variant": "#5800c8", "on-background": "#121e18", "tertiary": "#331619", "surface-container-highest": "#d8e6dc", "on-surface-variant": "#424843", "action-primary": "#7b2cff", "status-danger": "#c83939", "on-primary-container": "#86a490", "surface-variant": "#d8e6dc", "on-tertiary-container": "#bf9193", "on-surface": "#121e18", "primary": "#082417", "tertiary-fixed-dim": "#ecbabc", "secondary-container": "#7b2cff", "on-error-container": "#93000a", "on-primary": "#ffffff", "primary-fixed": "#cbead4", "surface-container-lowest": "#ffffff", "on-secondary": "#ffffff", "error": "#ba1a1a", "surface-container": "#e3f1e8", "primary-fixed-dim": "#afceb9", "surface": "#effdf3", "surface-bright": "#effdf3" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin-desktop": "2.5rem", "space-xl": "2rem", "space-md": "1rem", "margin-tablet": "1.5rem", "gutter": "1rem", "gutter-desktop": "1.5rem", "space-sm": "0.5rem", "space-lg": "1.5rem", "margin": "1rem", "space-xs": "0.25rem", "gutter-tablet": "1.25rem" }, fontFamily: { "title-sm": ["Inter"], "body-lg": ["Inter"], "display-hero-mobile": ["Bricolage Grotesque"], "label-sm": ["Inter"], "numeral-lg": ["Bricolage Grotesque"], "display-hero": ["Bricolage Grotesque"], "label-md": ["Inter"], "body-md": ["Inter"], "headline-sm": ["Bricolage Grotesque"], "headline-lg": ["Bricolage Grotesque"], "title-md": ["Inter"], "headline-md": ["Bricolage Grotesque"], "numeral-hero": ["Bricolage Grotesque"], "body-sm": ["Inter"] }, fontSize: { "title-sm": ["16px", { lineHeight: "22px", fontWeight: "600" }], "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }], "display-hero-mobile": ["36px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }], "label-sm": ["12px", { lineHeight: "16px", fontWeight: "500" }], "numeral-lg": ["28px", { lineHeight: "32px", fontWeight: "700" }], "display-hero": ["48px", { lineHeight: "52px", letterSpacing: "-0.02em", fontWeight: "700" }], "label-md": ["14px", { lineHeight: "18px", fontWeight: "500" }], "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }], "headline-sm": ["20px", { lineHeight: "26px", fontWeight: "600" }], "headline-lg": ["32px", { lineHeight: "38px", letterSpacing: "-0.01em", fontWeight: "700" }], "title-md": ["18px", { lineHeight: "24px", fontWeight: "600" }], "headline-md": ["24px", { lineHeight: "30px", letterSpacing: "-0.01em", fontWeight: "600" }], "numeral-hero": ["44px", { lineHeight: "48px", fontWeight: "700" }], "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }] } } } };</script></head><body class="bg-page-background text-ink-primary font-body-md text-body-md antialiased min-h-screen flex flex-col justify-between pt-safe pb-safe selection:bg-primary-fixed selection:text-ink-primary"><main class="flex-1 flex flex-col relative w-full bg-page-background px-margin"><div class="flex flex-col w-full">
<!-- Top Forest Green Hero / Branding Header -->
<section class="bg-header-panel text-header-text rounded-b-[24px] px-margin pt-space-lg pb-space-xl flex flex-col items-center text-center">

<h1 class="font-display-hero-mobile text-display-hero-mobile text-header-text tracking-tight mb-space-xs">
      CALCal
    </h1>
<p class="font-body-md text-body-md text-[#dce5df] max-w-[280px]">
      Log what you eat. See your macros and micros add up.
    </p>
</section>
<!-- Interactive Form Area on Linen Beige Canvas -->
<section class="px-margin -mt-space-md mb-space-lg">
<div class="bg-card-background rounded-[20px] p-space-md shadow-sm">
<!-- Segmented Tab Selector -->
<div class="flex items-center p-1 bg-page-background rounded-full mb-space-lg" role="tablist">
<button aria-selected="false" class="flex-1 py-space-xs text-center font-label-md text-label-md rounded-full text-ink-secondary transition-all" id="tab-signin" onclick="switchAuthMode('signin')" role="tab">
          Sign in
        </button>
<button aria-selected="true" class="flex-1 py-space-xs text-center font-label-md text-label-md rounded-full bg-card-background text-ink-primary shadow-sm font-semibold transition-all" id="tab-create" onclick="switchAuthMode('create')" role="tab">
          Create account
        </button>
</div>
<!-- Auth Form Container -->
<form class="flex flex-col gap-space-md" onsubmit="event.preventDefault();">
<!-- Username Field -->
<div class="flex flex-col gap-space-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-ink-primary" for="username">
              Username
            </label>
<!-- Available Status Pill -->
<span class="inline-flex items-center gap-1 text-status-safe bg-status-safe/10 px-2 py-0.5 rounded-full font-label-sm text-label-sm">
<span class="material-symbols-outlined text-[14px]">check_circle</span>
<span>available</span>
</span>
</div>
<div class="relative flex items-center">
<input class="w-full bg-page-background text-ink-primary font-body-md text-body-md rounded-xl px-space-md py-3 pr-10 focus:outline-none focus:bg-surface-container-high transition-colors placeholder:text-ink-secondary/60" id="username" placeholder="e.g. priya_sharma" type="text" value="priya_sharma">
<span class="material-symbols-outlined absolute right-3 text-status-safe text-[20px]">
              check
            </span>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-ink-primary" for="password">
            Password
          </label>
<div class="relative flex items-center">
<input class="w-full bg-page-background text-ink-primary font-body-md text-body-md rounded-xl px-space-md py-3 pr-11 focus:outline-none focus:bg-surface-container-high transition-colors placeholder:text-ink-secondary/60" id="password" placeholder="Enter password" type="password" value="masala_dosa_49">
<button aria-label="Toggle password visibility" class="absolute right-3 p-1 text-ink-secondary hover:text-ink-primary transition-colors flex items-center justify-center" onclick="togglePasswordVisibility('password', 'pw-icon')" type="button">
<span class="material-symbols-outlined text-[20px]" id="pw-icon">visibility</span>
</button>
</div>
</div>
<!-- Retype Password Field (Showing Mismatch State) -->
<div class="flex flex-col gap-space-xs" id="retype-container">
<label class="font-label-md text-label-md text-ink-primary" for="retype-password">
            Retype password
          </label>
<div class="relative flex items-center">
<input class="w-full bg-page-background text-ink-primary font-body-md text-body-md rounded-xl px-space-md py-3 pr-11 focus:outline-none focus:bg-surface-container-high transition-colors" id="retype-password" placeholder="Re-enter password" type="password" value="masala_dosa_99">
<button aria-label="Toggle retype password visibility" class="absolute right-3 p-1 text-ink-secondary hover:text-ink-primary transition-colors flex items-center justify-center" onclick="togglePasswordVisibility('retype-password', 'repw-icon')" type="button">
<span class="material-symbols-outlined text-[20px]" id="repw-icon">visibility</span>
</button>
</div>
<!-- Inline Error Badge / Message -->
<div class="flex items-center gap-1.5 pt-0.5 text-status-danger">
<span class="material-symbols-outlined text-[16px]">error</span>
<span class="font-label-sm text-label-sm">Passwords don't match.</span>
</div>
</div>
<!-- Security Disclaimer -->
<div class="flex items-start gap-2 pt-1 pb-1">
<span class="material-symbols-outlined text-ink-secondary text-[18px] shrink-0 mt-0.5">lock</span>
<p class="font-body-sm text-body-sm text-ink-secondary leading-snug">
            There is no password recovery, so keep your password safe.
          </p>
</div>
<!-- Primary Action CTA (Exclusively styled with Electric Purple) -->
<button class="w-full mt-space-xs py-3.5 px-space-lg rounded-[16px] bg-action-primary text-action-text font-title-sm text-title-sm tracking-normal text-center shadow-[0_8px_24px_-4px_rgba(26,38,32,0.14)] active:scale-[0.98] transition-transform flex items-center justify-center gap-2" id="submit-cta" type="submit">
<span>Create account</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Alternate Mode Prompt -->
<div class="text-center mt-space-md mb-space-sm">
<p class="font-body-md text-body-md text-ink-secondary" id="toggle-prompt">
        Already have an account? 
        <button class="font-title-sm text-title-sm text-ink-primary underline underline-offset-4 ml-1" onclick="switchAuthMode('signin')">
          Sign in
        </button>
</p>
</div>
</section>
<!-- Micronutrient & Regional Food Highlight Snippet -->

</div>
<script>
  function togglePasswordVisibility(fieldId, iconId) {
    const field = document.getElementById(fieldId);
    const icon = document.getElementById(iconId);
    if (!field || !icon) return;
    
    if (field.type === 'password') {
      field.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      field.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function switchAuthMode(mode) {
    const tabSignin = document.getElementById('tab-signin');
    const tabCreate = document.getElementById('tab-create');
    const retypeContainer = document.getElementById('retype-container');
    const submitCta = document.getElementById('submit-cta');
    const togglePrompt = document.getElementById('toggle-prompt');

    if (mode === 'signin') {
      tabSignin.className = 'flex-1 py-space-xs text-center font-label-md text-label-md rounded-full bg-card-background text-ink-primary shadow-sm font-semibold transition-all';
      tabSignin.setAttribute('aria-selected', 'true');
      
      tabCreate.className = 'flex-1 py-space-xs text-center font-label-md text-label-md rounded-full text-ink-secondary transition-all';
      tabCreate.setAttribute('aria-selected', 'false');

      if (retypeContainer) retypeContainer.classList.add('hidden');
      if (submitCta) {
        submitCta.innerHTML = '<span>Sign in</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>';
      }
      if (togglePrompt) {
        togglePrompt.innerHTML = 'New to CALCal? <button onclick="switchAuthMode(\'create\')" class="font-title-sm text-title-sm text-ink-primary underline underline-offset-4 ml-1">Create account</button>';
      }
    } else {
      tabCreate.className = 'flex-1 py-space-xs text-center font-label-md text-label-md rounded-full bg-card-background text-ink-primary shadow-sm font-semibold transition-all';
      tabCreate.setAttribute('aria-selected', 'true');

      tabSignin.className = 'flex-1 py-space-xs text-center font-label-md text-label-md rounded-full text-ink-secondary transition-all';
      tabSignin.setAttribute('aria-selected', 'false');

      if (retypeContainer) retypeContainer.classList.remove('hidden');
      if (submitCta) {
        submitCta.innerHTML = '<span>Create account</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>';
      }
      if (togglePrompt) {
        togglePrompt.innerHTML = 'Already have an account? <button onclick="switchAuthMode(\'signin\')" class="font-title-sm text-title-sm text-ink-primary underline underline-offset-4 ml-1">Sign in</button>';
      }
    }
  }
</script></main>

</body></html>
